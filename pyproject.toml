[project]
name = "alpro"
version = "0.1.0"
description = "AL PRO — Finance Operating System. AI-first, multi-asset analysis platform (Sprint 1 skeleton)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ali Aktas" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ops = ["sentry-sdk>=2.0"]  # SENTRY_DSN tanımlıysa hata izleme (deploy)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"alpro.api" = ["*.html"]
