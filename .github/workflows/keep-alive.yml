# Render free planda sunucu 15 dk hareketsizlikte uyur. Bu görev 10 dakikada
# bir /health ucuna istek atarak onu uyanık tutar — cron-job.org'a gerek yok.
# Adres RENDER_URL.txt dosyasından okunur; dosya boşken görev sessizce geçer.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping /health (sunucu uyumasin)
        run: |
          URL=$(grep -o 'https://[^ ]*' RENDER_URL.txt | head -1 || true)
          if [ -z "$URL" ]; then
            echo "RENDER_URL.txt icinde adres yok - kurulum tamamlaninca eklenecek."
            exit 0
          fi
          curl -fsS --max-time 30 "$URL/health" && echo " -> uyanik"
