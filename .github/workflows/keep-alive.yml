# Render free planda sunucu 15 dk hareketsizlikte uyur. Bu görev 10 dakikada
# bir /health ucuna istek atarak onu uyanık tutar. Adres RENDER_URL.txt
# dosyasının yorum olmayan ilk satırından okunur; adres yokken sessizce geçer.
# Ping başarısız olsa da görev kırmızıya düşmez (bildirim spam'i olmasın diye);
# gerçek teşhis için probe.yml kullanılır.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping /health (sunucu uyumasin)
        run: |
          URL=$(grep -v '^\s*#' RENDER_URL.txt | grep -o 'https://[^ ]*' | head -1 || true)
          if [ -z "$URL" ]; then
            echo "RENDER_URL.txt icinde adres yok - kurulum tamamlaninca eklenecek."
            exit 0
          fi
          if curl -fsS --max-time 60 "${URL%/}/health"; then
            echo " -> uyanik"
          else
            echo "UYARI: ${URL%/}/health yanit vermedi (uyaniyor olabilir ya da adres yanlis)."
          fi
          exit 0
