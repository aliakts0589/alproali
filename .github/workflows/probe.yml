# Elle tetiklenen teşhis görevi: verilen adresi (ya da varsayılan adayları)
# GitHub'ın sunucusundan yoklar ve yanıtı loga yazar. Claude Code oturumunun
# ağ politikası onrender.com'a kapalı olduğu için doğrulama buradan yapılır.
name: probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Denenecek tam adres (bos = varsayilan adaylar)"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuyu yokla
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          try() {
            u="$1"
            echo "=== $u"
            # free plan uykudan uyanirken ilk istek uzun surebilir - iki deneme
            for i in 1 2; do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 75 "$u" 2>/tmp/err || true)
              if [ -n "$code" ] && [ "$code" != "000" ]; then
                echo "HTTP $code (deneme $i)"
                echo "--- govde (ilk 400 bayt):"
                head -c 400 /tmp/body || true
                echo
                return 0
              fi
              echo "deneme $i basarisiz: $(cat /tmp/err)"
              sleep 10
            done
          }
          if [ -n "$INPUT_URL" ]; then
            try "$INPUT_URL"
          else
            try "https://alpro.onrender.com/health"
          fi
