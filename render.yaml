# Render.com "Blueprint" — Render'da "New + > Blueprint" ile bu repoyu seç.
# Kurulumda hiçbir alanı doldurmak zorunda değilsin: ALPRO_API_TOKEN'ı Render
# kendisi üretir (Environment sekmesinden okunur), isteğe bağlı anahtarlar
# boş bırakılabilir ve sonradan eklenebilir.
services:
  - type: web
    name: alpro
    runtime: docker
    plan: free            # ücretsiz plan: 15 dk hareketsizlikte uyur; ilk istek uyandırır
    healthCheckPath: /health
    envVars:
      - key: ALPRO_API_TOKEN
        generateValue: true   # Render güçlü bir anahtar üretir — panel/cron girişi
      - key: ALPRO_USER_NAME
        value: Ali
      - key: ALPRO_FOUNDER_EMAIL
        value: aliakts0589@gmail.com   # kurucu hesap: magic link ile bu adres girer
      - key: EVDS_API_KEY
        sync: false        # (isteğe bağlı) evds2.tcmb.gov.tr — resmi TCMB kurları
      - key: RESEND_API_KEY
        sync: false        # (isteğe bağlı) resend.com — magic link gerçek e-postayla gider
      - key: SENTRY_DSN
        sync: false        # (isteğe bağlı) sentry.io — hata izleme
    disk:
      name: alpro-data
      mountPath: /data
      sizeGB: 1
