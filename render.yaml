# Render.com "Blueprint" — repoya her push'ta Render bu dosyayı yeniden okur.
# ÜCRETSİZ PLAN NOTU: Render free planda kalıcı disk VERMEZ — eski sürümdeki
# "disk:" bloğu Blueprint sync'inin "failed" olmasının sebebiydi. Bu sürüm
# free planda sorunsuz kurulur; veriler yeniden kurulumda sıfırlanabilir,
# paneldeki "Veri Yedeği" kartı indir/geri yükle ile bunu telafi eder.
# Starter'a (~$7/ay) geçileceği gün: aşağıdaki "plan:" satırını "starter" yap
# ve en alttaki disk bloğunun yorumunu kaldır — kalıcı disk devreye girer.
services:
  - type: web
    name: alpro
    runtime: docker
    # Kaynak depo açıkça belirtilir — Blueprint'in depo bağlantısı boş kalırsa
    # ("source name cannot be empty" hatası) sync bunu kullanır.
    repo: https://github.com/aliakts0589/alproali
    branch: main
    plan: free            # ücretsiz plan: 15 dk hareketsizlikte uyur; ilk istek uyandırır
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ALPRO_API_TOKEN
        generateValue: true   # Render güçlü bir anahtar üretir — panel/cron girişi
      - key: ALPRO_USER_NAME
        value: Ali
      - key: ALPRO_FOUNDER_EMAIL
        value: aliakts0589@gmail.com   # kurucu hesap: magic link ile bu adres girer
      - key: EVDS_API_KEY
        sync: false        # (isteğe bağlı) evds2.tcmb.gov.tr — resmi TCMB kurları
      - key: RESEND_API_KEY
        sync: false        # (isteğe bağlı) resend.com — magic link gerçek e-postayla gider
      - key: SENTRY_DSN
        sync: false        # (isteğe bağlı) sentry.io — hata izleme
    # Starter planına geçince aç (free planda disk desteklenmez):
    # disk:
    #   name: alpro-data
    #   mountPath: /data
    #   sizeGB: 1
